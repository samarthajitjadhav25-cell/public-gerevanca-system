<div class="timeline"><div class="timeline-title"><h3>Update history</h3><span>{{ history|length }} update{{ '' if history|length==1 else 's' }}</span></div>{% for item in history %}<div class="timeline-item"><span class="timeline-dot"></span><div><b>{{ item.new_status }}</b>{% if item.remarks %}<p>{{ item.remarks }}</p>{% endif %}<small>{{ item.created_at }}{% if item.actor %} · {{ item.actor }}{% endif %}</small></div></div>{% endfor %}</div>
